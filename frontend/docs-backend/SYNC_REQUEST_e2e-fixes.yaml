# ---------------------------------------------------------------------------
# 2. FILE FRONTEND ĐÃ SỬA TRONG ĐỢT NÀY  (chỉ FE, sửa lỗi hiển thị)
# ---------------------------------------------------------------------------
file_frontend_da_sua:
  - path: "frontend/src/components/PortalLayout.tsx"
    loai: "Sửa lỗi build"
    mo_ta: >
      Bỏ 2 biến khai báo thừa `username`, `hasClearance` khỏi destructure
      `useAuth()` (phần dùng chúng đã bị comment ở bản đang phát triển) —
      trước đó `tsc -b` (bước `pnpm build`) fail, không tạo được bản phát hành.
    luu_y_FE: >
      Nếu định KHÔI PHỤC hiển thị tên tài khoản / chip "Quyền xem MẬT" trên
      header thì thêm lại 2 biến này vào destructure cùng lúc bỏ comment JSX
      tương ứng (đề xuất số 5 mục 5 bên dưới).

  - path: "frontend/src/App.css"
    loai: "Sửa lỗi CSS (4 chỗ)"
    mo_ta: |
      a) `.tab-bar .tab` (+ `.tab.active`) và `.thread-item`: THÊM `color`
         tường minh. Rule chung `button { color:#fff }` (dòng ~859) tràn vào
         các <button> dùng làm tab / dòng danh sách trên nền sáng -> chữ trắng
         trên nền trắng: MẤT tiêu đề tab và tiêu đề luồng ở `/kenh-chi-huy`
         và `/chi-dao-bao-cao`. Nay `.tab` = var(--text-muted), `.tab.active`
         + `.thread-item` = var(--text-main).
      b) `.news-thumb` (thẻ tin PostsPage): đổi thành `.news-article .news-thumb`
         / `.news-article .news-thumb img` / `.news-article .news-thumb-ph`.
         Trước đó trùng tên với `.news-thumb` của dải "tin liên quan" trang
         công khai (khai báo lại `width: calc(...)/4`) -> thumbnail PostsPage
         bị bóp còn ~25% bề rộng.
      c) `.news-article.is-open .news-thumb`: thêm `max-height:340px` và
         `...:has(.news-thumb-ph){display:none}` — bài mở đọc toàn văn mà
         không có ảnh bìa trước đây dựng khung rỗng cao ~600px.
      d) `.news-article.is-open.news-lead`: ép `flex-direction:column` — bài
         tiêu điểm khi mở đọc chuyển từ 2 cột (ảnh trái / chữ phải) về 1 cột,
         hết cột trống thừa bên cạnh.
      e) Thêm `.news-featured--noimg` (dùng bởi NewsBlock, xem dưới).

  - path: "frontend/src/components/NewsBlock.tsx"
    loai: "Sửa bố cục khi thiếu ảnh"
    mo_ta: |
      - Thêm biến `noImages` = mọi item đều không có `imageUrl` -> render
        DANH SÁCH GỌN (`ul.widget-list.news-textlist`) thay vì thẻ ảnh lớn.
        Khắc phục khối "Giáo dục chính trị" ở Bảng tin dựng khung ảnh rỗng
        cao ~560px (education material không bao giờ có ảnh bìa).
      - `FeaturedCard`: khi `!item.imageUrl` -> KHÔNG render `.news-featured__media`
        nữa; thêm class `news-featured--noimg`; hiện category dạng `.news-kicker`
        trên tiêu đề.

files_frontend_KHONG_dung:
  - "frontend/src/App.tsx — chỉ có thay đổi từ đợt gỡ Giao ban (route /giao-ban)."
  - "Không đụng src/pages/*, src/api/*, src/types/*, src/context/* trong đợt này."

